<!DOCTYPE html>
<html lang="en-US"> 
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Contact us - White water Rafting Company</title>
    <meta name="description" content="Contact White Water Rafting for reservations,questions,or feedback.">
    <meta name="author" content="risperomondi">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Rafting company Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-header">
            <h1>White Water Rafting Company</h1>
            <p>431 Main River Street</p>
            <p>Nanyuki,Kenya</p>
            <p>+254708703304</p>
            <p>info@whitewater.com</p>
        </section>

        <div class="contact-grid">
            <div class="map-container">
                <iframe src="https://google.com"allowfullscreen="" loading="lazy"referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <form class="contact-form">
                <div class="form-row"
                   <label for="fullname">Name</label>
                   <input type="text" id="fullname" name="fullname" placeholder="Your Name "required>
                </div

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email"name="email" placeholder="you@example.com" required>
                </div>

                <fieldset class="radio-group">
                    <legend>Message purpose</legend>
                    <label><input type="radio" id="purpose-general" name="purpose" value="general" checked> General Inquiry</label>
                    <label><input type="radio" id="purpose-reservation" name="purpose" value="reservation">Reservation Question</label>
                    <label><input type="radio" id="purpose suggestion" name="purpose" value="suggestion">Website Suggestion</label>
                </fieldset>

                <div class="form-column">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>
                </div>

                <label class="checkbox-label">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Please Subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section class="employees">
            <h2>We Are Here To Serve You</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/employee1.jpg" alt="Mitchele Okayo,Lead River Guide">
                    <figcaption>Mitchele Okayo - Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="David Theo,Reservation Manager">
                    <figcaption>David Theo - Reservation Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Stephanie Malia,Safety Coordinator">
                    <figcaption>Stephanie Malia - Safety Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy;2026 |White Water Rafting Company | risperomondi</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="Linkedin">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram">
            </a>
            </nav>
    </footer>
</body>
</html>
